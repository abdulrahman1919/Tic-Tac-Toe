<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="tic-tac-toe.css">
</head>

<body>
    <div class="firstcomeinterface">
        <div>
            <h1 class="gamname">Tic-Tac-Toe</h1>
            <h1>Game</h1>
        </div>
        <button class="startgamebtn">Let's Start</button>
    </div>
    <div class="headerofgame">
        <span class="gamname">Tic-Tac-Toe</span>
        <div class="players">
            <div class="player1">
                <h3>Player1</h3>
                <h2>O</h2>
            </div>
            <h1 class="vsheading">V/S</h1>
            <div class="player2">
                <h3>Player2</h3>
                <h2>X</h2>
            </div>
        </div>
    </div>
    <div class="gameresetbtn">

        <div class="game">
            <button class="gamebtns btn1"></button>
            <button class="gamebtns"></button>
            <button class="gamebtns btn3"></button>
            <button class="gamebtns"></button>
            <button class="gamebtns"></button>
            <button class="gamebtns"></button>
            <button class="gamebtns btn7"></button>
            <button class="gamebtns"></button>
            <button class="gamebtns btn8"></button>
        </div>
        <button class="restbtn">Restart</button>
    </div>
    <div class="showinner hide">
        <h2 class="showinnerwords"></h2>
        <button class="newgamebtn">New Game</button>
    </div>
    <script src="tic-tac-toe.js"></script>
</body>

</html>
